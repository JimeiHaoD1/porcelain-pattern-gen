<g data-layer="instance-priors">
<text x="1210" y="490" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#17212a">切向伸出与枝端着花</text>
<text x="1210" y="528" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#66737e">SW-3_tangent_terminal</text>
<text x="1210" y="552" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#d97706">花朵是方向明确的花枝末端</text>
<text x="1210" y="583" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#17212a">必须读出的关系</text>
<text x="1210" y="616" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#17212a">• 每朵花都有一条可读的末端花枝</text>
<text x="1210" y="640" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#17212a">• 花枝起步先服从父枝切线方向</text>
<text x="1210" y="664" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#17212a">• 次级支枝不能压过末端花枝方向</text>
<text x="1210" y="688" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#17212a">该原型的实例倾向</text>
<text x="1210" y="721" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#66737e">疏密：light</text>
<text x="1210" y="745" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#66737e">主支：terminal_support_do</text>
<text x="1210" y="766" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#66737e">minant</text>
<text x="1210" y="790" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#66737e">节奏：light_near_balanced</text>
<text x="1210" y="814" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#6f4a8e">单花位于方向明确的枝端，侧枝较轻，不能削弱末</text>
<text x="1210" y="835" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#6f4a8e">端花枝的指向。</text>
<text x="1210" y="859" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#c43b37">禁：浮花、放射穿花、次枝抢主</text>
</g>
<text x="58" y="1172" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#66737e">绿色＝允许挂接带　橙色＝花枝关系　蓝色＝贯穿轴意图　粉色＝花朵保护区</text>
<text x="1515" y="1172" text-anchor="end" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#c43b37">无槽位 · 无计划 · 无曲线</text>
</svg>
