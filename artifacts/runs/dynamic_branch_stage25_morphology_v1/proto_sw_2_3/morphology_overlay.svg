<g data-layer="instance-priors">
<text x="1210" y="490" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#17212a">轴线贯穿与花轴一体</text>
<text x="1210" y="528" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#66737e">SW-2_axis_penetrating</text>
<text x="1210" y="552" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#d97706">花朵属于连续主轴，而不是旁贴装饰</text>
<text x="1210" y="583" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#17212a">必须读出的关系</text>
<text x="1210" y="616" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#17212a">• 花前、花后仍能读出同一条主轴</text>
<text x="1210" y="640" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#17212a">• 先建立宽阔主支枝，再安排小支枝</text>
<text x="1210" y="664" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#17212a">• 主支枝从花朵保护区之外挂接</text>
<text x="1210" y="688" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#17212a">该原型的实例倾向</text>
<text x="1210" y="721" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#66737e">疏密：primary_sweep_led</text>
<text x="1210" y="745" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#66737e">主支：dominant</text>
<text x="1210" y="769" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#66737e">节奏：broad_axis_flank_al</text>
<text x="1210" y="790" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#66737e">ternation</text>
<text x="1210" y="814" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#6f4a8e">花朵属于连续轴线构成，以宽阔主支枝组织节奏，</text>
<text x="1210" y="835" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#6f4a8e">不依赖花托或包绕枝。</text>
<text x="1210" y="859" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#c43b37">禁：另插花托、旁贴花、碎枝撒点</text>
</g>
<text x="58" y="1172" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#66737e">绿色＝允许挂接带　橙色＝花枝关系　蓝色＝贯穿轴意图　粉色＝花朵保护区</text>
<text x="1515" y="1172" text-anchor="end" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#c43b37">无槽位 · 无计划 · 无曲线</text>
</svg>
