<g data-layer="instance-priors">
<text x="1210" y="490" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#17212a">谷部填充与花旁包绕</text>
<text x="1210" y="528" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#66737e">SW-1_valley_filling</text>
<text x="1210" y="552" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#d97706">谷部/谷侧枝托花，并可沿花侧包绕</text>
<text x="1210" y="583" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#17212a">必须读出的关系</text>
<text x="1210" y="616" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#17212a">• 每朵花都应读成由谷部结构托住</text>
<text x="1210" y="640" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#17212a">• 用完整枝组组织空白，不均匀撒枝</text>
<text x="1210" y="664" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#17212a">• 花朵周围必须保留清晰呼吸圈</text>
<text x="1210" y="688" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#17212a">该原型的实例倾向</text>
<text x="1210" y="721" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#66737e">疏密：sparse</text>
<text x="1210" y="745" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#66737e">主支：few_long_sweeps</text>
<text x="1210" y="769" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#66737e">节奏：sparse_asymmetric_a</text>
<text x="1210" y="790" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#66737e">lternation</text>
<text x="1210" y="814" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#6f4a8e">枝条较疏，少量较长主支枝承担结构，花朵以支撑</text>
<text x="1210" y="835" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#6f4a8e">关系为主。</text>
<text x="1210" y="859" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#c43b37">禁：浮花、穿花、均匀填空</text>
</g>
<text x="58" y="1172" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#66737e">绿色＝允许挂接带　橙色＝花枝关系　蓝色＝贯穿轴意图　粉色＝花朵保护区</text>
<text x="1515" y="1172" text-anchor="end" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#c43b37">无槽位 · 无计划 · 无曲线</text>
</svg>
